services:
  postgres:
    image: postgis/postgis:16-3.4
    # Apple Silicon: image is amd64; Docker Desktop emulates it.
    platform: linux/amd64
    container_name: versys-postgres
    environment:
      POSTGRES_USER: versys
      POSTGRES_PASSWORD: versys
      POSTGRES_DB: versys
    # Host 5433 avoids clashing with a local Postgres already on 5432
    ports:
      - "5433:5432"
    volumes:
      - versys_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U versys -d versys"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: versys-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMS/USSD webhook sink — swap for aggregator in staging
  mailpit:
    image: axllent/mailpit:latest
    container_name: versys-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  migrate:
    build: .
    container_name: versys-migrate
    env_file: .env
    environment: &app-env
      # Override host .env localhost URLs with compose service names
      DATABASE_URL: postgresql://versys:versys@postgres:5432/versys
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "./node_modules/typeorm/cli.js", "migration:run", "-d", "dist/database/data-source.js"]
    restart: "no"
    profiles: ["app"]

  seed:
    build: .
    container_name: versys-seed
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/database/seeds/run-seeds.js"]
    restart: "no"
    profiles: ["app"]

  api:
    build: .
    container_name: versys-api
    env_file: .env
    environment:
      <<: *app-env
      PROCESS: api
      API_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    profiles: ["app"]

  realtime:
    build: .
    container_name: versys-realtime
    env_file: .env
    environment:
      <<: *app-env
      PROCESS: realtime
      REALTIME_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    profiles: ["app"]

  worker:
    build: .
    container_name: versys-worker
    env_file: .env
    environment:
      <<: *app-env
      PROCESS: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    profiles: ["app"]

volumes:
  versys_pg:
