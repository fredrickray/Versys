openapi: 3.1.0
info:
  title: VERSYS API
  version: 0.3.0
  description: |
    Veritas Emergency Response System — REST contract for mobile/web clients.
    Base path `/v1`. Bearer JWT after OTP verify.
servers:
  - url: http://localhost:3000/v1
    description: Local API
tags:
  - name: Health
  - name: Ops
  - name: Auth
  - name: Devices
  - name: Incidents
  - name: Assignments
  - name: Escalation
  - name: Dispatch
  - name: Location
  - name: Announcements
  - name: Notifications
  - name: Analytics
  - name: Audit
  - name: Places
  - name: Channels
  - name: RBAC
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        "200":
          description: Process is up (includes eventMode / maintenanceMode flags)
  /ready:
    get:
      tags: [Health]
      summary: Readiness (DB + Redis)
      responses:
        "200":
          description: Dependencies reachable
        "503":
          description: Dependency down
  /ops/status:
    get:
      tags: [Ops]
      summary: Tech-desk snapshot (event freeze posture)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Ops desk status
  /rbac/matrix:
    get:
      tags: [RBAC]
      summary: Permission matrix reference
      responses:
        "200":
          description: Staff and dispatcher permission sets
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Request phone OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneE164]
              properties:
                phoneE164: { type: string, example: "+2348012345678" }
      responses:
        "202":
          description: OTP dispatched (or mocked in non-prod)
        "429":
          description: Rate limited
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and issue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneE164, code]
              properties:
                phoneE164: { type: string }
                code: { type: string }
      responses:
        "201":
          description: Access + refresh tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: string }
        "401":
          description: Invalid OTP
  /incidents:
    post:
      tags: [Incidents]
      summary: Create incident (app / SOS / dispatcher-logged)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: Incident registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "429":
          description: Alert rate limited
    get:
      tags: [Incidents]
      summary: List incidents
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/IncidentStatus"
      responses:
        "200":
          description: Incident list
  /incidents/offline:
    post:
      tags: [Incidents]
      summary: Flush offline-queued alert (idempotent by clientEventId)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientEventId, type, channel]
              properties:
                clientEventId: { type: string }
                type: { $ref: "#/components/schemas/IncidentType" }
                channel:
                  type: string
                  enum: [app_button, rapid_sos, dispatcher_phone, sms, ussd]
                latitude: { type: number }
                longitude: { type: number }
                placeId: { type: string, format: uuid }
                locationLabel: { type: string }
                capturedAt: { type: string, format: date-time }
                metadata: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Accepted for processing
  /incidents/{incidentId}:
    get:
      tags: [Incidents]
      summary: Get incident
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
  /incidents/{incidentId}/assignments:
    post:
      tags: [Assignments]
      summary: Assign or self-accept intervention
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assigneeUserId: { type: string, format: uuid }
      responses:
        "201":
          description: Assignment created/accepted
  /assignments/{assignmentId}/accept:
    post:
      tags: [Assignments]
      summary: Accept assignment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "201":
          description: Accepted
  /assignments/{assignmentId}/reject:
    post:
      tags: [Assignments]
      summary: Reject with reason (audited)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [currently_busy, too_far, other]
                note: { type: string, maxLength: 240 }
      responses:
        "201":
          description: Rejected
  /incidents/{incidentId}/escalate:
    post:
      tags: [Escalation]
      summary: Manual escalate
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "201":
          description: Escalated
  /incidents/{incidentId}/resolve:
    post:
      tags: [Escalation]
      summary: Confirm / final-close incident
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                final: { type: boolean, default: false }
      responses:
        "201":
          description: Updated
  /incidents/{incidentId}/level4:
    post:
      tags: [Escalation]
      summary: Record Level-4 external phone escalation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalContactId]
              properties:
                externalContactId: { type: string, format: uuid }
                note: { type: string }
      responses:
        "201":
          description: Level-4 call logged
  /incidents/{incidentId}/intervention-map:
    get:
      tags: [Location]
      summary: Live intervention map points for an incident
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Map payload
  /location/ping:
    post:
      tags: [Location]
      summary: Ingest location ping (incident or on-duty only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, recordedAt]
              properties:
                latitude: { type: number }
                longitude: { type: number }
                accuracyMetres: { type: number }
                incidentId: { type: string, format: uuid }
                onDuty: { type: boolean }
                recordedAt: { type: string, format: date-time }
      responses:
        "202":
          description: Accepted
  /devices/tokens:
    post:
      tags: [Devices]
      summary: Register FCM device token for the authenticated user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, minLength: 32, maxLength: 512 }
                platform: { type: string, enum: [ios, android, web] }
      responses:
        "201":
          description: Token registered (or reassigned to this user)
    delete:
      tags: [Devices]
      summary: Unregister FCM device token
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32, maxLength: 512 }
      responses:
        "204":
          description: Removed (or already absent)
  /notifications/{attemptId}/ack:
    post:
      tags: [Notifications]
      summary: Ack push delivery (cancels SMS fallback)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Acknowledged
  /announcements:
    get:
      tags: [Announcements]
      summary: List announcements for current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Announcement list
    post:
      tags: [Announcements]
      summary: Create targeted announcement
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
                targetCategories:
                  type: array
                  items: { type: string }
                blinkingBlue: { type: boolean }
      responses:
        "201":
          description: Created
  /dispatch/board:
    get:
      tags: [Dispatch]
      summary: Open incidents board
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/IncidentStatus" }
        - in: query
          name: alertLevel
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: Board rows
  /dispatch/staff:
    get:
      tags: [Dispatch]
      summary: Assignable staff roster
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Staff list
  /dispatch/incidents/{incidentId}:
    get:
      tags: [Dispatch]
      summary: Incident detail with assignments
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Detail
  /dispatch/incidents/{incidentId}/assign:
    post:
      tags: [Dispatch]
      summary: Dispatcher assigns staff
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeUserId]
              properties:
                assigneeUserId: { type: string, format: uuid }
      responses:
        "201":
          description: Assignment created
  /analytics/summary:
    get:
      tags: [Analytics]
      summary: Aggregate response-time / volume summary
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Summary
  /analytics/incidents/{incidentId}:
    get:
      tags: [Analytics]
      summary: Per-incident route / response insights
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Insights
  /audit/false-alarms:
    get:
      tags: [Audit]
      summary: Candidate false-alarm incidents
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: hours
          schema: { type: integer, minimum: 1, maximum: 168 }
      responses:
        "200":
          description: Candidates
  /audit/false-alarms/{incidentId}/flag:
    post:
      tags: [Audit]
      summary: Flag incident as false alarm
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Flagged
  /places/muster:
    get:
      tags: [Places]
      summary: Muster points
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Places
  /places/external-contacts:
    get:
      tags: [Places]
      summary: Level-4 agency contacts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Contacts
  /channels/sms/inbound:
    post:
      tags: [Channels]
      summary: Aggregator inbound SMS webhook
      parameters:
        - in: header
          name: x-versys-webhook-secret
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromE164, body]
              properties:
                fromE164: { type: string }
                body: { type: string }
                providerMessageId: { type: string }
      responses:
        "200":
          description: Parsed and registered (or help SMS sent)
  /channels/ussd/session:
    post:
      tags: [Channels]
      summary: Aggregator USSD session webhook
      parameters:
        - in: header
          name: x-versys-webhook-secret
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneE164]
              properties:
                sessionId: { type: string }
                phoneE164: { type: string }
                text: { type: string }
                networkCode: { type: string }
      responses:
        "200":
          description: Menu / end response
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    IncidentStatus:
      type: string
      enum: [reported, intervention_ongoing, resolved]
    IncidentType:
      type: string
      enum: [fire, fight, ongoing_crime, suspicious_movement, accident, invasion, violent_attack]
    AlertLevel:
      type: integer
      enum: [1, 2, 3, 4]
    CreateIncidentRequest:
      type: object
      required: [type, channel]
      properties:
        type: { $ref: "#/components/schemas/IncidentType" }
        channel:
          type: string
          enum: [app_button, rapid_sos, dispatcher_phone, sms, ussd]
        latitude: { type: number }
        longitude: { type: number }
        placeId: { type: string, format: uuid }
        locationLabel: { type: string }
        metadata: { type: object, additionalProperties: true }
    Incident:
      type: object
      properties:
        id: { type: string, format: uuid }
        publicCode: { type: string }
        type: { $ref: "#/components/schemas/IncidentType" }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        alertLevel: { $ref: "#/components/schemas/AlertLevel" }
        channel: { type: string }
        locationLabel: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }
