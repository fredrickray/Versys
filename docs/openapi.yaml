openapi: 3.1.0
info:
  title: VERSYS API
  version: 2.0.0
  description: |
    Veritas Emergency Response System — locked mobile/web contract (Phase 9).
    REST base path `/v1`. Bearer JWT after OTP verify.
    Realtime: Socket.IO on the realtime process (default :3001), namespace `/realtime`.
    See also `docs/mobile-integration.md`.
servers:
  - url: http://localhost:3000/v1
    description: Local API
tags:
  - name: Health
  - name: Ops
  - name: Auth
  - name: Devices
  - name: Incidents
  - name: Assignments
  - name: Escalation
  - name: Dispatch
  - name: Location
  - name: Announcements
  - name: Notifications
  - name: Analytics
  - name: Audit
  - name: Places
  - name: Channels
  - name: RBAC
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        "200":
          description: Process is up (includes eventMode / maintenanceMode flags)
  /ready:
    get:
      tags: [Health]
      summary: Readiness (DB + Redis)
      responses:
        "200":
          description: Dependencies reachable
        "503":
          description: Dependency down
  /ops/status:
    get:
      tags: [Ops]
      summary: Tech-desk snapshot (event freeze posture)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Ops desk status
  /rbac/matrix:
    get:
      tags: [RBAC]
      summary: Permission matrix reference
      responses:
        "200":
          description: Staff and dispatcher permission sets
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Request phone OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneE164]
              properties:
                phoneE164:
                  $ref: "#/components/schemas/PhoneE164"
      responses:
        "202":
          description: OTP dispatched (Termii or mock)
          content:
            application/json:
              schema:
                type: object
                required: [expiresInSeconds]
                properties:
                  expiresInSeconds: { type: integer }
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Live SMS provider failed to send OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and issue a device-bound token family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneE164, code, deviceId]
              properties:
                phoneE164:
                  $ref: "#/components/schemas/PhoneE164"
                code: { type: string, minLength: 4, maxLength: 8 }
                deviceId:
                  type: string
                  format: uuid
                  description: Random installation UUID retained by the client
      responses:
        "201":
          description: Access token and initial refresh token
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid OTP or inactive account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a device-bound refresh token
      description: |
        Each refresh token is single-use. The client must serialize refreshes and
        atomically replace its stored refresh token after a successful response.
        Reuse or a device mismatch revokes the complete token family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Rotated access and refresh tokens
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid, expired, reused, revoked, or device-mismatched token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /incidents:
    post:
      tags: [Incidents]
      summary: Create incident (app / SOS / dispatcher-logged)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Client-generated key, scoped to the authenticated user.
          schema:
            type: string
            minLength: 1
            maxLength: 120
            pattern: '^[A-Za-z0-9._-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: Incident registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "409":
          description: Idempotency key was reused with a different payload
        "429":
          description: Alert rate limited
    get:
      tags: [Incidents]
      summary: List incidents visible to the current actor
      description: Reporters see their incidents, accepted responders see active assignments, and dispatch users see operational incidents. Precise coordinates are omitted unless operational access requires them.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/IncidentStatus"
      responses:
        "200":
          description: Incident list
  /incidents/drills:
    post:
      tags: [Incidents]
      summary: Create an authorized drill without external delivery
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CreateIncidentRequest"
                - type: object
                  required: [purpose]
                  properties:
                    purpose: { type: string, minLength: 3, maxLength: 240 }
      responses:
        "201":
          description: Drill committed without FCM or SMS delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "403":
          description: Missing drill-management permission
        "409":
          description: Idempotency key conflicts with another drill payload
  /incidents/offline:
    post:
      tags: [Incidents]
      summary: Flush offline-queued alert (idempotent by clientEventId)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineAlertRequest"
      responses:
        "202":
          description: Accepted for processing (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineAlertResponse"
  /incidents/{incidentId}:
    get:
      tags: [Incidents]
      summary: Get an actor-authorized incident view
      description: Unauthorized and unknown incident IDs both return `404`. Reporter phone and arbitrary metadata are never returned by this view.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Actor-authorized incident view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          description: Incident absent or not visible to the current actor
  /incidents/visitor:
    post:
      tags: [Incidents]
      summary: Public visitor alert (no JWT; rate limited per phone)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneE164, type]
              properties:
                phoneE164: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
                type: { $ref: "#/components/schemas/IncidentType" }
                latitude: { type: number }
                longitude: { type: number }
                placeId: { type: string, format: uuid }
                locationLabel: { type: string, maxLength: 120 }
                note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Redacted incident view registered with channel=visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "429":
          description: Alert rate limited
  /incidents/{incidentId}/details:
    patch:
      tags: [Incidents]
      summary: Append a reporter note (reporter, staff or dispatcher)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 1000 }
                photoUrls:
                  type: array
                  maxItems: 3
                  items: { type: string, format: uri, pattern: '^https://' }
      responses:
        "200":
          description: Updated redacted incident view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "403":
          description: Not the reporter and not staff or dispatcher
        "404":
          description: Incident not found
  /incidents/{incidentId}/assignments:
    post:
      tags: [Assignments]
      summary: Assign or self-accept intervention
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assigneeUserId: { type: string, format: uuid }
      responses:
        "201":
          description: Assignment created/accepted
  /assignments/{assignmentId}/accept:
    post:
      tags: [Assignments]
      summary: Accept assignment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "201":
          description: Accepted
  /assignments/{assignmentId}/reject:
    post:
      tags: [Assignments]
      summary: Reject with reason (audited)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [currently_busy, too_far, other]
                note: { type: string, maxLength: 240 }
      responses:
        "201":
          description: Rejected
  /incidents/{incidentId}/escalate:
    post:
      tags: [Escalation]
      summary: Manual escalate
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "201":
          description: Escalated
  /incidents/{incidentId}/resolve:
    post:
      tags: [Escalation]
      summary: Confirm / final-close incident
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                final: { type: boolean, default: false }
      responses:
        "201":
          description: Updated
  /incidents/{incidentId}/level4:
    post:
      tags: [Escalation]
      summary: Record Level-4 external phone escalation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalContactId]
              properties:
                externalContactId: { type: string, format: uuid }
                note: { type: string }
      responses:
        "201":
          description: Level-4 call logged
  /incidents/{incidentId}/intervention-map:
    get:
      tags: [Location]
      summary: Live intervention map points for an incident
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Map payload
  /location/shifts/start:
    post:
      tags: [Location]
      summary: Start a server-owned staff shift
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Active shift with server-owned expiry
  /location/shifts/current:
    get:
      tags: [Location]
      summary: Get the caller's active, unexpired shift
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active shift or null
  /location/shifts/end:
    post:
      tags: [Location]
      summary: End the caller's active staff shift
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Shift ended and stale routing context removed
  /location/ping:
    post:
      tags: [Location]
      summary: Ingest a fresh location ping under server-owned context
      description: Requires either an active, unexpired staff shift or an accepted assignment on an open incident. Clients cannot set duty state.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, accuracyMetres, recordedAt]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                accuracyMetres: { type: number, minimum: 0 }
                incidentId: { type: string, format: uuid }
                recordedAt: { type: string, format: date-time }
      responses:
        "202":
          description: Accepted
        "400":
          description: Stale, future, inaccurate, out-of-order, or missing active context
  /devices/tokens:
    post:
      tags: [Devices]
      summary: Register FCM device token for the authenticated user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, minLength: 32, maxLength: 512 }
                platform: { type: string, enum: [ios, android, web] }
      responses:
        "201":
          description: Token registered (or reassigned to this user)
    delete:
      tags: [Devices]
      summary: Unregister FCM device token
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32, maxLength: 512 }
      responses:
        "204":
          description: Removed (or already absent)
  /notifications/{attemptId}/ack:
    post:
      tags: [Notifications]
      summary: Ack push delivery (cancels SMS fallback)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Acknowledged
  /announcements:
    get:
      tags: [Announcements]
      summary: List announcements for current user (each includes authorName)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Announcement list (with authorName string|null)
    post:
      tags: [Announcements]
      summary: Create targeted announcement
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
                targetCategories:
                  type: array
                  items: { type: string }
                blinkingBlue: { type: boolean }
      responses:
        "201":
          description: Created
  /dispatch/board:
    get:
      tags: [Dispatch]
      summary: Open incidents board
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/IncidentStatus" }
        - in: query
          name: alertLevel
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: Board rows
  /dispatch/staff:
    get:
      tags: [Dispatch]
      summary: Assignable staff roster
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Staff list
  /dispatch/incidents/{incidentId}:
    get:
      tags: [Dispatch]
      summary: Incident detail with assignments
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Detail
  /dispatch/incidents/{incidentId}/assign:
    post:
      tags: [Dispatch]
      summary: Dispatcher assigns staff
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeUserId]
              properties:
                assigneeUserId: { type: string, format: uuid }
      responses:
        "201":
          description: Assignment created
  /analytics/summary:
    get:
      tags: [Analytics]
      summary: Aggregate response-time / volume summary
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Summary
  /analytics/incidents/{incidentId}:
    get:
      tags: [Analytics]
      summary: Per-incident route / response insights
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Insights
  /audit/false-alarms:
    get:
      tags: [Audit]
      summary: Candidate false-alarm incidents
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: hours
          schema: { type: integer, minimum: 1, maximum: 168 }
      responses:
        "200":
          description: Candidates
  /audit/false-alarms/{incidentId}/flag:
    post:
      tags: [Audit]
      summary: Flag incident as false alarm
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Flagged
  /places/muster:
    get:
      tags: [Places]
      summary: Muster points
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Places
  /places/external-contacts:
    get:
      tags: [Places]
      summary: Level-4 agency contacts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Contacts
  /channels/sms/inbound:
    post:
      tags: [Channels]
      summary: Simulator inbound SMS webhook
      description: |
        This endpoint is simulator-only. `providerMessageId` is the provider's
        immutable delivery identifier and is durably replay-protected. Repeating
        a completed message returns the original body without creating another
        incident. A reused key with a different canonical payload returns `409`.
      parameters:
        - in: header
          name: x-versys-webhook-secret
          required: true
          description: Required in staging and production; use a 32+ character simulator secret.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromE164, body, providerMessageId]
              properties:
                fromE164:
                  $ref: "#/components/schemas/PhoneE164"
                body: { type: string }
                providerMessageId: { type: string, minLength: 1, maxLength: 160 }
      responses:
        "200":
          description: Parsed and registered, an invalid-SMS help reply, or a completed replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundSmsResponse"
        "400":
          description: Invalid webhook request shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid webhook secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Provider message ID was reused with a different payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Webhook or alert rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Another callback owns the idempotency lease. Retry after the indicated delay.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /channels/ussd/session:
    post:
      tags: [Channels]
      summary: Simulator USSD session webhook
      description: |
        This endpoint is simulator-only. Redis keeps intermediate menu state for
        120 seconds. Only the terminal confirmation (`text: "1"` at the confirm
        step) receives durable replay protection, keyed by `sessionId`; a retry
        after Redis session expiry returns the stored terminal response instead
        of creating a new incident.
      parameters:
        - in: header
          name: x-versys-webhook-secret
          required: true
          description: Required in staging and production; use a 32+ character simulator secret.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneE164]
              properties:
                sessionId: { type: string, minLength: 1, maxLength: 160 }
                phoneE164:
                  $ref: "#/components/schemas/PhoneE164"
                text: { type: string }
                networkCode: { type: string }
      responses:
        "200":
          description: Menu, cancellation, terminal confirmation, or completed terminal replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UssdWebhookResponse"
        "400":
          description: Invalid webhook request shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid webhook secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session ID was reused with a different terminal confirmation identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Webhook or alert rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Another callback owns the terminal-confirmation lease. Retry after the indicated delay.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    PhoneE164:
      type: string
      pattern: '^\+[1-9]\d{7,14}$'
      example: "+2348012345678"
    InboundSmsResponse:
      oneOf:
        - type: object
          required: [ok, publicCode, incidentId]
          properties:
            ok: { type: boolean, const: true }
            publicCode: { type: string }
            incidentId: { type: string, format: uuid }
        - type: object
          required: [ok, reason]
          properties:
            ok: { type: boolean, const: false }
            reason: { type: string, enum: [unparseable, unknown_place] }
    UssdWebhookResponse:
      type: object
      required: [sessionId, message, end]
      properties:
        sessionId: { type: string }
        message: { type: string }
        end: { type: boolean }
    RefreshTokenRequest:
      type: object
      required: [refreshToken, deviceId]
      properties:
        refreshToken: { type: string, minLength: 20, maxLength: 4096 }
        deviceId:
          type: string
          format: uuid
          description: Same installation UUID used during OTP verification
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: string, example: "15m" }
    ErrorResponse:
      type: object
      properties:
        statusCode: { type: integer }
        error: {}
        correlationId: { type: string, nullable: true }
        path: { type: string }
        timestamp: { type: string, format: date-time }
    IncidentStatus:
      type: string
      enum: [reported, intervention_ongoing, resolved]
    IncidentType:
      type: string
      enum: [fire, fight, ongoing_crime, suspicious_movement, accident, invasion, violent_attack]
    AlertLevel:
      type: integer
      enum: [1, 2, 3, 4]
