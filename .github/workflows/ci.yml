name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: versys
          POSTGRES_PASSWORD: versys
          POSTGRES_DB: versys
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U versys -d versys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: versys
      DATABASE_PASSWORD: versys
      DATABASE_NAME: versys
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: test-access-secret-change-me-32chars
      JWT_REFRESH_SECRET: test-refresh-secret-change-me-32chars

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24.9+ required for Jest require(esm) of Nest packages
          node-version: "24"
          cache: npm
      - name: Use npm 10 (matches lockfile)
        run: npm install -g npm@10.9.2
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --passWithNoTests
      - run: npm run build
      - name: Migrate + seed
        run: |
          npm run migration:run
          npm run seed
      - name: E2E core loop
        run: npm run test:e2e
        env:
          NODE_OPTIONS: --experimental-vm-modules
