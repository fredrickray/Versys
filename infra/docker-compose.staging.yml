services:
  api:
    build: ..
    command: ["node", "dist/main.api.js"]
    env_file: ../.env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  realtime:
    build: ..
    command: ["node", "dist/main.realtime.js"]
    env_file: ../.env
    ports:
      - "3001:3001"
    depends_on:
      - redis

  worker:
    build: ..
    command: ["node", "dist/main.worker.js"]
    env_file: ../.env
    depends_on:
      - redis
      - postgres
